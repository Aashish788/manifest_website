[images]
  remote_images = ["https://source.unsplash.com/.*", "https://images.unsplash.com/.*", "https://ext.same-assets.com/.*", "https://ugc.same-assets.com/.*"]

[build]
  command = "bun run build"
  publish = "dist"

# Deep linking redirect - MUST come before the /* catch-all
[[redirects]]
  from = "/reel/:videoId"
  to = "/reel.html?id=:videoId"
  status = 200

# Catch-all redirect for SPA (MUST be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  
# Ensure app-ads.txt is served correctly
[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain"
